          name: API 查询：用户询问 Unity 类、方法、属性、参数、返回值、示例用法或 Scripting API。
        - id: class_error_debug
          name: 报错调试：用户提供异常、错误日志、堆栈、构建失败、Package Manager、IL2CPP、Shader、Input System
            等问题。
        - id: class_version_migration
          name: 版本迁移：用户询问 Unity 旧版本升级、弃用 API、Obsolete、Deprecated、Migration 或 Unity
            2022 到 Unity 6 的变化。
        - id: class_code_advice
          name: 代码建议：用户提供代码并希望指出修改位置、优化写法、解释潜在 bug 或给出可参考代码。
        - id: class_concept_explain
          name: 概念解释：用户询问 Unity Manual 中的概念、工作流、组件原理、编辑器功能或开发流程。
        - id: class_other
          name: 其他问题：无法归入以上类别，或资料明显不足的问题。
