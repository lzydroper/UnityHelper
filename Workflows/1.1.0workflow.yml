    - data:
        classes:
        - id: error_null_reference
          name: 空引用或对象销毁：NullReferenceException、MissingReferenceException、GetComponent 返回 null、对象已被 Destroy。
        - id: error_lifecycle
          name: 生命周期与协程：Awake/Start/Update 顺序、Coroutine couldn't be started、对象激活状态相关错误。
        - id: error_deprecated_api
          name: API 弃用或版本不兼容：obsolete、deprecated、版本升级后接口变化。
        - id: error_namespace_package
          name: 命名空间、包或程序集缺失：CS0246、namespace could not be found、Package Manager 依赖问题。
        - id: error_type_conversion
          name: 类型转换或序列化错误：InvalidCastException、类型不匹配、Inspector 序列化字段异常。
        - id: error_build_il2cpp
          name: 构建、平台或 IL2CPP：build failed、IL2CPP、Android/iOS/WebGL 平台构建失败。
        - id: error_shader_material
          name: Shader、材质或渲染：shader compile error、pink material、URP/HDRP 渲染相关问题。
        - id: error_hot_update_binding
          name: Lua/热更新绑定错误：xLua、toLua、C# 与 Lua 交互、绑定生成或调用失败。
