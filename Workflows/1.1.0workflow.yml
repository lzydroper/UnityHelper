    nodes:
    - data:
        desc: 接收用户问题、可选代码片段、版本和语言上下文。
        selected: false
        title: 开始
        type: start
        variables:
        - label: 代码上下文（可选）
          max_length: 12000
          options: []
          required: false
          type: paragraph
          variable: code_context
        - label: 当前 Unity 版本（可选）
          options:
          - Unity 6.4（默认）
          - Unity 6
          - Unity 2022 LTS
          - Unity 2021 LTS
          - 其他/不确定
          required: false
          type: select
          variable: unity_version
        - label: 代码语言（可选）
          options:
          - C#
          - Lua/xLua/toLua
          - ShaderLab/HLSL
          - JavaScript
          - 不确定
          required: false
          type: select
          variable: code_language
      height: 218
      id: start
      position:
