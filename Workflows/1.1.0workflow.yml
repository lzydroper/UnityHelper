    opening_statement: 你好，我是 Unity 开发智能适配助手。你可以问我 Unity API 用法、报错排查、版本迁移、代码修改建议，或提供 C#/Lua 代码片段让我结合知识库分析。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - NullReferenceException 一般怎么排查？
    - Unity 2022 升级到 Unity 6 要注意什么？
    - Rigidbody 和 CharacterController 有什么区别？
    - 这段 GetComponent 代码为什么可能返回 null？
    - C# 脚本改成 Lua 热更新时要注意什么？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
