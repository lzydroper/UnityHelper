        y: 260
      positionAbsolute:
        x: 40
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        classes:
        - id: class_api_query
          name: API 查询：用户询问 Unity 类、方法、属性、参数、返回值、示例用法或 Scripting API。
        - id: class_error_debug
          name: 报错调试：用户提供异常、错误日志、堆栈、构建失败、Package Manager、IL2CPP、Shader、Input System、Addressables 等问题。
        - id: class_version_migration
          name: 版本迁移：用户询问 Unity 旧版本升级、弃用 API、Obsolete、Deprecated、Migration 或 Unity 2022 到 Unity 6 的变化。
        - id: class_code_advice
          name: 代码建议：用户提供代码并希望指出修改位置、优化写法、解释潜在 bug 或给出可参考代码。
        - id: class_concept_explain
          name: 概念解释：用户询问 Unity Manual 中的概念、工作流、组件原理、编辑器功能或开发流程。
        - id: class_hot_update
          name: Lua/热更新适配：用户询问 C# 与 Lua、xLua、toLua、热更新绑定、脚本转换或跨语言调用。
        - id: class_other
          name: 其他问题：无法归入以上类别，或资料明显不足的问题。
        desc: 一级意图识别，决定主检索路径。
        instruction: '请只输出最匹配的一个分类。若用户同时提供报错和代码，优先选择“报错调试”；若用户明确要求修改代码，选择“代码建议”；若问题涉及旧版本到新版本差异，选择“版本迁移”；若问题重点是 Lua/xLua/toLua 或热更新，选择“Lua/热更新适配”。'
        instructions: '请只输出最匹配的一个分类。若用户同时提供报错和代码，优先选择“报错调试”；若用户明确要求修改代码，选择“代码建议”；若问题涉及旧版本到新版本差异，选择“版本迁移”；若问题重点是 Lua/xLua/toLua 或热更新，选择“Lua/热更新适配”。'
