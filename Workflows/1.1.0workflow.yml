app:
  description: v1.1.0：基于 Unity 6.4 官方文档与社区 Issue 案例的 RAG 工作流，覆盖 API 查询、报错诊断、代码建议、版本迁移、概念解释与 Lua/热更新适配兜底；本版本为 LLM 生成节点加入失败兜底提示。
