services:
  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.9.5}
    container_name: unity-open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      WEBUI_NAME: ${WEBUI_NAME:-Unity Development Assistant}
      WEBUI_URL: ${WEBUI_URL:-http://localhost:3000}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me-generate-a-stable-secret}
      ENABLE_LOGIN_FORM: "true"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: ${DIFY_OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${DIFY_OPENAI_API_KEY:-}
      DEFAULT_MODELS: ${DIFY_MODEL_ID:-unity-rag-assistant}
      DEFAULT_PINNED_MODELS: ${DIFY_MODEL_ID:-unity-rag-assistant}
      TASK_MODEL_EXTERNAL: ${DIFY_MODEL_ID:-unity-rag-assistant}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data:
    name: unity-open-webui-data
